name: Build Assimp CLI

on:
  workflow_dispatch: # On demand.

env:
  ASSIMP_REF: v6.0.6

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
        include:
          - os: windows-latest
            os_and_arch: windows-x64
            exe: build/bin/Release/assimp.exe
          - os: macos-latest
            os_and_arch: macos-universal2
            exe: build/bin/assimp

    steps:
    - name: Clone Assimp
      uses: actions/checkout@v7
      with:
        repository: assimp/assimp
        ref: ${{ env.ASSIMP_REF }}
        submodules: true

    - name: Configure Build
      if: matrix.os == 'windows-latest'
      run: cmake -S . -B ./build -A x64 -DCMAKE_BUILD_TYPE=Release -DASSIMP_BUILD_ASSIMP_TOOLS=ON -DASSIMP_BUILD_ASSIMP_VIEW=OFF -DASSIMP_BUILD_TESTS=OFF -DBUILD_SHARED_LIBS=OFF -DASSIMP_INSTALL=OFF -DASSIMP_INSTALL_PDB=OFF

    - name: Configure Build
      if: matrix.os == 'macos-latest'
      run: cmake -S . -B ./build -G "Unix Makefiles" -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_BUILD_TYPE=Release -DASSIMP_BUILD_ASSIMP_TOOLS=ON -DASSIMP_BUILD_TESTS=OFF -DBUILD_SHARED_LIBS=OFF -DASSIMP_INSTALL=OFF -DASSIMP_INSTALL_PDB=OFF

    - name: Build Release
      run: cmake --build ./build --config Release

    - name: Build Test
      run: |
        ${{ matrix.exe }} version
        if [ "$RUNNER_OS" = macOS ]; then lipo ${{ matrix.exe }} -verify_arch arm64 x86_64; fi
      shell: bash

    - name: Conversion Tests
      run: |
        for model in FBX/box.fbx 3DS/fels.3ds 3MF/box.3mf Collada/duck.dae PLY/cube.ply X/test.x; do
          ${{ matrix.exe }} info "test/models/$model" | grep -E '^Faces:[[:space:]]+[0-9]+' > /dev/null # Read by Assimp.get_face_count.
          ${{ matrix.exe }} export "test/models/$model" test.obj -tri
          ${{ matrix.exe }} export test.obj test.dae -tri # Same chain as Universal Importer.
        done
        ${{ matrix.exe }} extract test/models/glTF2/BoxTextured-glTF-Binary/BoxTextured.glb # Embedded textures.
      shell: bash

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: assimp-cli-${{ env.ASSIMP_REF }}-${{ matrix.os_and_arch }}
        path: build/bin/
        retention-days: 7
